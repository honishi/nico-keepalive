root: true
env:
  browser: true
  es2023: true
  jest: true
  webextensions: true
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: "latest"
  sourceType: module
  ecmaFeatures:
    jsx: true
plugins:
  - "@typescript-eslint"
extends:
  - "eslint:recommended"
  - "plugin:@typescript-eslint/recommended"
  - "prettier"
ignorePatterns:
  - dist/**
  - node_modules/**
  - webpack/**
  - references/**
